    document.addEventListener('DOMContentLoaded', function () {
      document.body.dataset.dataReady = '1';
    });
  </script>

  <header class="topbar">
    <label class="mode">
      <span class="mode__label">Режим:</span>
      <select id="mode-select" class="mode__select">
        <option value="1" selected>Режим 1</option>
        <option value="2">Режим 2</option>
      </select>
    </label>
    <span id="mode-note" class="mode__note" hidden></span>
  </header>

  <main class="page">

    <!-- ================= БЛОК 1 — ВИБІР БІЛЕТА ================= -->
    <section class="card card--edit" aria-labelledby="block1-title">
      <h2 id="block1-title" class="card__title">Блок 1. Вибір білета</h2>

      <form id="ticket-form" class="row" autocomplete="off">
        <label class="row__label" for="ticket-input">Номер білета (1–30):</label>
        <input id="ticket-input" class="row__input" type="number" min="1" max="30" step="1"
               inputmode="numeric" placeholder="напр. 1">
        <button id="ticket-ok" class="btn" type="submit">OK</button>
      </form>

      <p id="ticket-error" class="msg msg--error" role="alert" hidden></p>
    </section>

    <!-- ================= БЛОК 2 — ПОШУК ПИТАНЬ ================= -->
    <section class="card card--search card--edit" aria-labelledby="block2-title">
      <h2 id="block2-title" class="card__title">Блок 2. Пошук питань</h2>

      <form id="search-form" class="row" autocomplete="off">
        <label class="row__label" for="search-input">Ключові слова:</label>
        <input id="search-input" class="row__input row__input--wide" type="text"
               placeholder="почніть вводити — пошук іде автоматично">
      </form>

      <!-- Фіксована висота: не більше 20vh, далі — внутрішня прокрутка -->
      <div id="search-results" class="results" role="list" aria-live="polite"></div>
    </section>

    <!-- ================= БЛОК 3 — РЕЗУЛЬТАТ ================= -->
    <section class="card" aria-labelledby="block3-title">
      <div class="card__head">
        <h2 id="block3-title" class="card__title">Блок 3. Результат</h2>
        <button id="clear-btn" class="btn btn--ghost" type="button">Очистити</button>
      </div>

      <p id="sync-note" class="msg msg--sync" hidden></p>

      <div id="output" class="output"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
